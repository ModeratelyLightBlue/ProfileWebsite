<script>
	/**
	 * p5 creates the canvas in setup(), which runs after DOMContentLoaded.
	 * Wait until .p5Canvas exists, then run callback(canvas).
	 */
	function whenP5CanvasReady(callback, options = {}) {
		const { timeoutMs = 15000 } = options;
		const pick = () => document.querySelector(".p5Canvas");

		const existing = pick();
		if (existing) {
			callback(existing);
			return;
		}

		const obs = new MutationObserver(() => {
			const el = pick();
			if (el) {
				obs.disconnect();
				callback(el);
			}
		});
		obs.observe(document.documentElement, { childList: true, subtree: true });

		const deadline = Date.now() + timeoutMs;
		(function poll() {
			const el = pick();
			if (el) {
				obs.disconnect();
				callback(el);
				return;
			}
			if (Date.now() < deadline) {
				requestAnimationFrame(poll);
			} else {
				obs.disconnect();
				console.warn("whenP5CanvasReady: no .p5Canvas within timeout");
			}
		})();
	}

	document.addEventListener("DOMContentLoaded", () => {
		whenP5CanvasReady((canvas) => {
			const canvasArray = document.getElementsByClassName("p5Canvas");
			console.log("logging 1 by 1");
			for (let i = 0; i < canvasArray.length; i++) {
				console.log(canvasArray[i]);
			}
			console.log(canvasArray);

			// Single canvas: fixed layer so it does not scroll with the page
			const newDiv = document.createElement("div");
			newDiv.setAttribute("aria-hidden", "true");
			newDiv.style.cssText =
				"position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; margin: 0; padding: 0;";

			canvas.style.cssText =
				"display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none;";

			const ctx = canvas.getContext("2d");
			// ctx is ready when you need 2D drawing from outside p5

			document.body.prepend(newDiv);
			console.log(newDiv);
			newDiv.appendChild(canvas);
			
		
		});
	});
</script>
